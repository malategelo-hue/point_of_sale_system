<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Requests - HardSales</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <style>
        .refund-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .status { padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .pending { background: #fef3c7; color: #92400e; }
        .approved { background: #dbeafe; color: #1e40af; }
        .rejected { background: #fecaca; color: #991b1b; }
        .actions { margin-top: 12px; display: flex; gap: 10px; }
        .ok-btn { background: #16a34a; color: white; border: none; padding: 7px 15px; border-radius: 5px; cursor: pointer; }
        .no-btn { background: #ef4444; color: white; border: none; padding: 7px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="pos-container">
        <header class="pos-header">
            <h2>🔄 Refund Requests</h2>
            <a href="index.html" class="logout-btn">← Back</a>
        </header>

        <div id="refund-list"></div>
    </div>

    <script src="js/admin-script.js"></script>
    <script>
        function showRefunds() {
            // Basahin mismo sa listahan na galing sa customer
            const refunds = JSON.parse(localStorage.getItem('refundRequests')) || [];
            const orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            const list = document.getElementById('refund-list');

            if(refunds.length === 0) {
                list.innerHTML = `<p style="text-align:center; padding:40px;">No refund requests yet.</p>`;
                return;
            }

            list.innerHTML = '';
            refunds.forEach((r, idx) => {
                list.innerHTML += `
                <div class="refund-card">
                    <p><strong>Order #${r.orderId}</strong> | ${r.date}</p>
                    <p>Items: ${r.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                    <p>Total: ₱ ${r.total.toFixed(2)}</p>
                    <span class="status ${r.status}">${r.status.toUpperCase()}</span>

                    ${r.status === 'pending' ? `
                    <div class="actions">
                        <button class="ok-btn" onclick="accept(${idx}, ${r.orderId})">✅ Approve</button>
                        <button class="no-btn" onclick="deny(${idx}, ${r.orderId})">❌ Reject</button>
                    </div>
                    ` : ''}
                </div>`;
            });
        }

        function accept(idx, orderId) {
            if(!confirm('Approve this refund?')) return;

            let refunds = JSON.parse(localStorage.getItem('refundRequests')) || [];
            refunds[idx].status = 'approved';
            localStorage.setItem('refundRequests', JSON.stringify(refunds));

            let orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            const found = orders.find(o => o.id === orderId);
            if(found) {
                found.refundStatus = 'approved';
                found.status = 'Refunded';
            }
            localStorage.setItem('custOrders', JSON.stringify(orders));

            alert('✅ Refund Approved!');
            showRefunds();
        }

        function deny(idx, orderId) {
            if(!confirm('Reject this refund?')) return;

            let refunds = JSON.parse(localStorage.getItem('refundRequests')) || [];
            refunds[idx].status = 'rejected';
            localStorage.setItem('refundRequests', JSON.stringify(refunds));

            let orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            const found = orders.find(o => o.id === orderId);
            if(found) found.refundStatus = 'rejected';
            localStorage.setItem('custOrders', JSON.stringify(orders));

            alert('❌ Refund Rejected!');
            showRefunds();
        }

        document.addEventListener('DOMContentLoaded', showRefunds);
    </script>
</body>
</html>
