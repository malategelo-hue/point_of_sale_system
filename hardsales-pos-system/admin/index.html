<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HardSales</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <style>
        .dashboard {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-top: 30px;
        }
        .dash-card {
            background: white; padding: 30px; text-align: center;
            border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            text-decoration: none; color: inherit; transition: 0.2s;
        }
        .dash-card:hover { transform: translateY(-5px); background: #eff6ff; }
        .dash-card h3 { font-size: 22px; margin-bottom: 10px; color: #1e40af; }
    </style>
</head>
<body>
    <div class="pos-container">
        <header class="pos-header">
            <h2>👨‍💼 Admin Dashboard - HardSales POS</h2>
            <a href="../index.html" class="logout-btn">Logout</a>
        </header>

        <div class="dashboard">
            <a href="pos.html" class="dash-card">
                <h3>🛒 POS Terminal</h3>
                <p>Start new transaction</p>
            </a>
            <a href="products.html" class="dash-card">
                <h3>📦 Inventory</h3>
                <p>Add/Edit products</p>
            </a>
            <a href="sales.html" class="dash-card">
                <h3>📊 Sales Report</h3>
                <p>View sales history</p>
            </a>
        </div>
    </div>
</body>
</html>
