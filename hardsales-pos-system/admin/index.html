<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HardSales</title>
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>
    <div class="pos-container">
        <header class="pos-header">
            <h2>📊 Admin Dashboard Overview</h2>
            <a href="../index.html" class="logout-btn" onclick="localStorage.clear()">Logout</a>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Items Sold</h3>
                <p id="stat-items">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Sales</h3>
                <p id="stat-sales">₱ 0.00</p>
            </div>
            <div class="stat-card">
                <h3>Today's Transactions</h3>
                <p id="stat-trans">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Products</h3>
                <p id="stat-prod">0</p>
            </div>
        </div>

        <h3>📦 Stock Status</h3>
        <table class="stock-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="stock-body"></tbody>
        </table>

        <div class="dashboard">
            <a href="pos.html" class="dash-card"><h3>🛒 POS Terminal</h3></a>
            <a href="products.html" class="dash-card"><h3>📦 Inventory</h3></a>
            <a href="sales.html" class="dash-card"><h3>📊 Sales Report</h3></a>
            <a href="refunds.html" class="dash-card"><h3>🔄 Refund Requests</h3></a>
        </div>
    </div>

    <script src="js/admin-script.js"></script>
    <script>
        function loadDashboard() {
            const sales = JSON.parse(localStorage.getItem('hardSales')) || [];
            const products = JSON.parse(localStorage.getItem('hardProducts')) || [];

            let totalItems = 0;
            let totalSales = 0;
            sales.forEach(t => {
                totalItems += t.items.length;
                totalSales += t.total;
            });

            document.getElementById('stat-items').textContent = totalItems;
            document.getElementById('stat-sales').textContent = `₱ ${totalSales.toFixed(2)}`;
            document.getElementById('stat-trans').textContent = sales.length;
            document.getElementById('stat-prod').textContent = products.length;

            const body = document.getElementById('stock-body');
            body.innerHTML = '';
            products.forEach(p => {
                let status = 'Good';
                let cls = 'ok';
                if(p.stock <= 0) { status = 'Out of Stock'; cls = 'out'; }
                else if(p.stock <= 5) { status = 'Low Stock'; cls = 'low'; }

                body.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>₱ ${p.price.toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td class="${cls}">${status}</td>
                </tr>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
