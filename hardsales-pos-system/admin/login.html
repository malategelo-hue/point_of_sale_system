<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HardSales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px;
        }
        .login-box h2 { text-align: center; color: #991b1b; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; }
        .btn { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #991b1b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form onsubmit="adminLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="admin-user" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="admin-pass" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="link">
            <a href="../index.html">← Back to Main</a>
        </div>
    </div>

    <script>
        function adminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            
            if(user === "admin" && pass === "admin123") {
                localStorage.setItem('isAdmin', 'true');
                alert("Welcome Admin!");
                window.location.href = "index.html";
            } else {
                alert("Incorrect Username or Password!");
            }
        }
    </script>
</body>
</html>
