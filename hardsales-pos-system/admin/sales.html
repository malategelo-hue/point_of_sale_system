<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report - HardSales</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <style>
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .total-box { background: #16a34a; color: white; padding: 15px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; }
        .sale-card { background: white; padding: 18px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .sale-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .empty-report { text-align: center; padding: 60px 20px; color: #64748b; }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="report-header">
            <div>
                <h1>📊 Sales Report</h1>
                <p>View all completed transactions</p>
            </div>
            <button class="clear-btn" onclick="clearSales()">🗑 Clear All Sales</button>
        </div>

        <div id="total-area"></div>
        <div id="sales-list"></div>
    </div>

    <script>
        function loadSales() {
            const sales = JSON.parse(localStorage.getItem('hardSales')) || [];
            const list = document.getElementById('sales-list');
            const totalArea = document.getElementById('total-area');

            if(sales.length === 0) {
                list.innerHTML = `<div class="empty-report">
                    <h3>No Sales Yet</h3>
                    <p>Transactions will appear here once customers place orders.</p>
                </div>`;
                totalArea.innerHTML = '';
                return;
            }

            // Total Sales
            const grandTotal = sales.reduce((sum, s) => sum + s.total, 0);
            totalArea.innerHTML = `<div class="total-box">Total Earnings: ₱ ${grandTotal.toFixed(2)}</div>`;

            // List of sales
            list.innerHTML = '';
            sales.forEach(sale => {
                list.innerHTML += `
                <div class="sale-card">
                    <div class="sale-head">
                        <span>Order #${sale.id}</span>
                        <span>${sale.date}</span>
                    </div>
                    <p>Items: ${sale.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                    <p>Payment: ${sale.method.toUpperCase()}</p>
                    <p style="font-weight:bold; margin-top:5px;">Total: ₱ ${sale.total.toFixed(2)}</p>
                </div>`;
            });
        }

        function clearSales() {
            if(!confirm('Delete ALL sales records? This cannot be undone!')) return;
            localStorage.removeItem('hardSales');
            alert('✅ All sales data cleared!');
            loadSales();
        }

        document.addEventListener('DOMContentLoaded', loadSales);
    </script>
</body>
</html>
