<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - HardSales</title>
    <link rel="stylesheet" href="css/customer-style.css">
</head>
<body>
    <header class="cust-header">
        <div class="container">
            <h1>🛒 Shopping Cart</h1>
            <a href="index.html" class="back-link">← Continue Shopping</a>
        </div>
    </header>

    <div class="container cart-page">
        <div class="cart-left">
            <div id="cart-items">
                <div class="empty-state">
                    <div class="empty-icon">🛍</div>
                    <h3>Your cart is empty</h3>
                    <p>Add items to get started</p>
                </div>
            </div>
            <button class="clear-btn" onclick="clearCart()">🗑 Clear Cart</button>
        </div>

        <div class="cart-right">
            <div class="summary-box">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₱ 0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="grand-total">₱ 0.00</span>
                </div>

                <div class="payment-section">
                    <h4>Payment Method</h4>
                    <select id="pay-method" onchange="toggleCashInput()">
                        <option value="cash">Cash</option>
                        <option value="gcash">GCash</option>
                        <option value="card">Card</option>
                    </select>

                    <div id="cash-input-area">
                        <label>Cash Received:</label>
                        <input type="number" id="cash-amount" placeholder="Enter amount" oninput="computeChange()">
                        <p class="change-text">Change: <span id="change">₱ 0.00</span></p>
                    </div>
                </div>

                <button class="checkout-btn" onclick="placeOrder()">✅ Place Order</button>
            </div>
        </div>
    </div>

    <script src="js/customer-script.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('hardsalesCart')) || [];

        function updateCartDisplay() {
            const list = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('grand-total');

            if(cart.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-icon">🛍</div><h3>Your cart is empty</h3><p>Add items to get started</p></div>`;
                subtotalEl.textContent = '₱ 0.00';
                totalEl.textContent = '₱ 0.00';
                return;
            }

            list.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                list.innerHTML += `
                <div class="cart-item">
                    <div class="item-name">${item.name}</div>
                    <div class="qty-control">
                        <button onclick="changeQty(${idx}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)">+</button>
                    </div>
                    <div class="item-price">₱ ${(item.price * item.qty).toFixed(2)}</div>
                    <button class="remove-item" onclick="removeItem(${idx})">×</button>
                </div>
                `;
            });

            subtotalEl.textContent = `₱ ${total.toFixed(2)}`;
            totalEl.textContent = `₱ ${total.toFixed(2)}`;
            computeChange();
        }

        function changeQty(idx, num) {
            cart[idx].qty += num;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            saveCart();
            updateCartDisplay();
            updateCartCount();
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            saveCart();
            updateCartDisplay();
            updateCartCount();
        }

        function clearCart() {
            if(confirm('Clear all items?')) {
                cart = [];
                saveCart();
                updateCartDisplay();
                updateCartCount();
            }
        }

        function saveCart() {
            localStorage.setItem('hardsalesCart', JSON.stringify(cart));
        }

        function toggleCashInput() {
            const val = document.getElementById('pay-method').value;
            document.getElementById('cash-input-area').style.display = val === 'cash' ? 'block' : 'none';
        }

        function computeChange() {
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const cash = parseFloat(document.getElementById('cash-amount').value) || 0;
            document.getElementById('change').textContent = `₱ ${Math.max(0, cash - total).toFixed(2)}`;
        }

        function placeOrder() {
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const method = document.getElementById('pay-method').value;

            if(cart.length === 0) return alert('Cart is empty!');
            if(method === 'cash') {
                const cash = parseFloat(document.getElementById('cash-amount').value) || 0;
                if(cash < total) return alert('Insufficient cash amount!');
            }

            // Save order history
            const order = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                items: [...cart],
                total: total,
                method: method,
                status: 'Paid'
            };

            let orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            orders.unshift(order);
            localStorage.setItem('custOrders', JSON.stringify(orders));

            // Show Receipt
            showReceipt(order);

            // Clear cart
            cart = [];
            saveCart();
            updateCartDisplay();
            updateCartCount();
        }

        function showReceipt(order) {
            let itemsText = order.items.map(i => `${i.qty}x ${i.name} - ₱ ${(i.price*i.qty).toFixed(2)}`).join('\n');
            alert(`
🧾 OFFICIAL RECEIPT
============================
HardSales Hardware Store
Order #: ${order.id}
Date: ${order.date}

${itemsText}
============================
TOTAL: ₱ ${order.total.toFixed(2)}
Payment: ${order.method.toUpperCase()}
Status: ${order.status}

Thank you for buying!
            `);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartDisplay();
            toggleCashInput();
        });
    </script>
</body>
</html>
