<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - HardSales</title>
    <link rel="stylesheet" href="css/customer-style.css">
</head>
<body>
    <header class="cust-header">
        <div class="container">
            <h1>🛠 HardSales Hardware Store</h1>
            <div class="header-actions">
                <a href="cart.html" class="cart-link">🛒 My Cart <span id="cart-count">0</span></a>
                <a href="orders.html" class="cart-link">📋 My Orders</a>
                <a href="../index.html" class="logout-link">Logout</a>
            </div>
        </div>
    </header>

    <div class="container main-grid">
        <aside class="sidebar">
            <div class="sidebar-box">
                <h3>Search Product</h3>
                <input type="text" id="search-input" placeholder="Search products..." oninput="showProducts()">
            </div>
            <div class="sidebar-box">
                <h3>Categories</h3>
                <select id="category-filter" onchange="showProducts()">
                    <option value="all">All Products</option>
                </select>
            </div>
        </aside>

        <main class="products-area">
            <h2>Available Products</h2>
            <div class="product-grid" id="product-list">
                <div style="grid-column:1/-1; text-align:center; padding:50px; color:#64748b;">
                    <h3>No products available yet</h3>
                    <p>Please wait for Admin to add items.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/customer-script.js"></script>
    <script>
        function getAdminProducts() {
            return JSON.parse(localStorage.getItem('hardProducts')) || [];
        }

        function showProducts() {
            const allProds = getAdminProducts();
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;

            let filtered = allProds;
            if(cat !== 'all') filtered = filtered.filter(p => p.category === cat);
            if(search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));

            const container = document.getElementById('product-list');
            if(allProds.length === 0 || filtered.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#64748b;">
                    <h3>${allProds.length === 0 ? 'No products yet' : 'No items found'}</h3>
                    <p>${allProds.length === 0 ? 'Admin will add products soon.' : 'Try different search or category.'}</p>
                </div>`;
                updateCategoryFilter();
                return;
            }

            container.innerHTML = '';
            filtered.forEach(p => {
                const isLow = p.stock > 0 && p.stock <= 5;
                const isOut = p.stock <= 0;
                container.innerHTML += `
                <div class="product-card ${isOut ? 'out-stock' : isLow ? 'low-stock' : ''}">
                    <div class="prod-img">📦</div>
                    <h3>${p.name}</h3>
                    <p class="price">₱ ${p.price.toFixed(2)}</p>
                    <p class="stock-text">Stock: ${p.stock}</p>
                    <button class="add-btn" ${isOut ? 'disabled' : ''} onclick="addToCart('${p.name}', ${p.price})">
                        ${isOut ? 'Out of Stock' : 'Add to Cart'}
                    </button>
                </div>`;
            });
            updateCategoryFilter();
        }

        function updateCategoryFilter() {
            const allProds = getAdminProducts();
            const select = document.getElementById('category-filter');
            select.innerHTML = `<option value="all">All Products</option>`;
            const cats = [...new Set(allProds.map(p => p.category))];
            cats.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
        }

        document.addEventListener('DOMContentLoaded', () => {
            showProducts();
            updateCartCount();
        });
    </script>
</body>
</html>
