<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - HardSales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #15803d, #22c55e);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; padding: 35px 25px; border-radius: 12px; width: 100%; max-width: 380px;
        }
        .login-box h2 { text-align: center; color: #15803d; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .link { margin-top: 15px; text-align: center; font-size: 14px; }
        .link a { color: #15803d; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Customer Login</h2>
        <form onsubmit="custLogin(event)">
            <div class="input-group">
                <label>Email / Username</label>
                <input type="text" id="cust-user" value="customer1" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="cust-pass" value="cust123" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="link">
            <a href="../index.html">← Back</a> |
            <a href="register.html">Create Account</a>
        </div>
    </div>

    <script>
        function custLogin(e) {
            e.preventDefault();
            const user = document.getElementById('cust-user').value;
            const pass = document.getElementById('cust-pass').value;
            if(user && pass) {
                localStorage.setItem('custName', user);
                alert(Welcome ${user}!);
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
