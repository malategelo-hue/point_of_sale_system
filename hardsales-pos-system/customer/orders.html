<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - HardSales</title>
    <link rel="stylesheet" href="css/customer-style.css">
    <style>
        .order-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .status { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .paid { background: #bbf7d0; color: #166534; }
        .pending { background: #fef3c7; color: #92400e; }
        .approved { background: #dbeafe; color: #1e40af; }
        .rejected { background: #fecaca; color: #991b1b; }
        .btn-group { margin-top: 12px; display: flex; gap: 8px; }
        .refund-btn { background: #ef4444; color: white; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; }
        .refund-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>
    <header class="cust-header">
        <div class="container">
            <h1>📋 My Orders</h1>
            <a href="index.html" class="back-link">← Back to Shop</a>
        </div>
    </header>

    <div class="container">
        <div id="orders-list"></div>
    </div>

    <script>
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            const list = document.getElementById('orders-list');

            if(orders.length === 0) {
                list.innerHTML = `<p style="text-align:center; padding:40px;">You have no orders yet.</p>`;
                return;
            }

            list.innerHTML = '';
            orders.forEach((order, idx) => {
                let statusClass = 'paid';
                let statusText = 'Paid';
                if(order.refundStatus === 'pending') { statusClass = 'pending'; statusText = 'Refund Pending'; }
                if(order.refundStatus === 'approved') { statusClass = 'approved'; statusText = 'Refund Approved'; }
                if(order.refundStatus === 'rejected') { statusClass = 'rejected'; statusText = 'Refund Rejected'; }

                list.innerHTML += `
                <div class="order-card">
                    <p><strong>Order #${order.id}</strong> | ${order.date}</p>
                    <p>Items: ${order.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                    <p>Total: ₱ ${order.total.toFixed(2)}</p>
                    <span class="status ${statusClass}">${statusText}</span>
                    <div class="btn-group">
                        <button class="refund-btn" ${order.refundStatus ? 'disabled' : ''} onclick="sendRefund(${idx})">
                            ${order.refundStatus ? 'Request Sent' : 'Request Refund'}
                        </button>
                    </div>
                </div>`;
            });
        }

        function sendRefund(idx) {
            if(!confirm('Send refund request to Admin?')) return;

            let orders = JSON.parse(localStorage.getItem('custOrders')) || [];
            orders[idx].refundStatus = 'pending';
            localStorage.setItem('custOrders', JSON.stringify(orders));

            // I-save mismo sa listahan na binabasa ng Admin
            let allRefunds = JSON.parse(localStorage.getItem('refundRequests')) || [];
            allRefunds.unshift({
                orderId: orders[idx].id,
                date: orders[idx].date,
                total: orders[idx].total,
                items: orders[idx].items,
                status: 'pending'
            });
            localStorage.setItem('refundRequests', JSON.stringify(allRefunds));

            alert('✅ Refund request sent! Admin will review it.');
            loadOrders();
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
