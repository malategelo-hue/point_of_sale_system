<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - HardSales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #15803d, #22c55e);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .reg-box {
            background: white; padding: 30px 25px; border-radius: 12px; width: 100%; max-width: 380px;
        }
        .reg-box h2 { text-align: center; color: #15803d; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .link { margin-top: 15px; text-align: center; font-size: 14px; }
        .link a { color: #15803d; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>Create Customer Account</h2>
        <form onsubmit="createAcc(event)">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="new-user" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="new-pass" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        function createAcc(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            const user = document.getElementById('new-user').value;
            const pass = document.getElementById('new-pass').value;

            let accounts = JSON.parse(localStorage.getItem('custAccounts')) || [];
            const exist = accounts.find(a => a.username === user);
            if(exist) return alert('Username already taken!');

            accounts.push({ name, username: user, password: pass });
            localStorage.setItem('custAccounts', JSON.stringify(accounts));
            
            alert('Account created successfully! Please login.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
