<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardSales POS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .main-box {
            background: white; padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 420px; text-align: center;
        }
        .main-box h1 { color: #1e3a8a; margin-bottom: 30px; }
        .role-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; text-decoration: none; color: white;
        }
        .admin { background: #dc2626; }
        .customer { background: #16a34a; }
    </style>
</head>
<body>
    <div class="main-box">
        <h1>🛠️ HardSales POS</h1>
        <a href="admin/login.html" class="role-btn admin">🔐 Admin / Cashier Login</a>
        <a href="customer/login.html" class="role-btn customer">🛒 Customer Login</a>
    </div>
</body>
</html>
